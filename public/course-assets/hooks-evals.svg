  <text x="54" y="60" class="title">Deterministička kontrola nad nedeterminističkim modelom</text>
  <g><rect x="50" y="156" width="220" height="136" rx="18" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="50" y="156" width="7" height="136" rx="4" fill="#334155"/><text x="76" y="198" class="label">Input / task</text><text x="76" y="231" class="sub">zahtev i kontekst</text></g>
