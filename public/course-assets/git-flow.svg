<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Git kao zapis razvojnih odluka</title>
  <desc id="desc">Tok od issue-a preko razvojne grane, commit-a i pull request-a do integrisanog main-a.</desc>
  <rect width="1200" height="500" rx="24" fill="#fff"/>
  <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#1F2937}.title{font-size:30px;font-weight:700;fill:#163A66}.label{font-size:17px;font-weight:700}.sub{font-size:12.5px;fill:#64748B}</style>
  <text x="54" y="60" class="title">Git kao zapis razvojnih odluka</text>
  <g><rect x="50" y="150" width="188" height="140" rx="18" fill="#fff" stroke="#185ABD" stroke-width="2"/><rect x="50" y="150" width="7" height="140" rx="4" fill="#185ABD"/><text x="74" y="190" class="label">Issue</text><text x="74" y="224" class="sub">zahtev ili</text><text x="74" y="244" class="sub">promena</text></g>
  <path d="M238 220H270" stroke="#94A3B8" stroke-width="3"/><path d="m264 213 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <g><rect x="278" y="150" width="188" height="140" rx="18" fill="#fff" stroke="#0E7490" stroke-width="2"/><rect x="278" y="150" width="7" height="140" rx="4" fill="#0E7490"/><text x="302" y="190" class="label">Razvojna grana</text><text x="302" y="224" class="sub">izolovan rad</text><text x="302" y="244" class="sub">na jednoj temi</text></g>
  <path d="M466 220H498" stroke="#94A3B8" stroke-width="3"/><path d="m492 213 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <g><rect x="506" y="150" width="188" height="140" rx="18" fill="#fff" stroke="#0E7490" stroke-width="2"/><rect x="506" y="150" width="7" height="140" rx="4" fill="#0E7490"/><text x="530" y="190" class="label">Commit-i</text><text x="530" y="224" class="sub">male koherentne</text><text x="530" y="244" class="sub">promene</text></g>
  <path d="M694 220H726" stroke="#94A3B8" stroke-width="3"/><path d="m720 213 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <g><rect x="734" y="150" width="188" height="140" rx="18" fill="#fff" stroke="#6D28D9" stroke-width="2"/><rect x="734" y="150" width="7" height="140" rx="4" fill="#6D28D9"/><text x="758" y="190" class="label">Pull request</text><text x="758" y="224" class="sub">pregled promene</text><text x="758" y="244" class="sub">i provera</text></g>
  <path d="M922 220H954" stroke="#94A3B8" stroke-width="3"/><path d="m948 213 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <g><rect x="962" y="150" width="188" height="140" rx="18" fill="#fff" stroke="#047857" stroke-width="2"/><rect x="962" y="150" width="7" height="140" rx="4" fill="#047857"/><text x="986" y="190" class="label">main</text><text x="986" y="224" class="sub">integrisana</text><text x="986" y="244" class="sub">i proverena verzija</text></g>
  <path d="M372 300V348H600V300" fill="none" stroke="#D97706" stroke-width="3"/>
  <rect x="250" y="370" width="700" height="72" rx="16" fill="#FFFDF7" stroke="#F2D7A2"/>
  <text x="284" y="413" class="label" fill="#B45309">Konflikt → razumevanje namere → izgradnja projekta i testovi</text>
