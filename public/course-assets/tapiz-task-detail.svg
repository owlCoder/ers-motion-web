  <text x="74" y="58" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="700" fill="#202334">Tapiz Boards</text>
  <text x="76" y="128" font-family="Inter,Segoe UI,Arial" font-size="14" fill="#667085">Sprint 1 / Rezervacija opreme</text>
  <text x="76" y="162" font-family="Inter,Segoe UI,Arial" font-size="27" font-weight="750" fill="#1d2939">TASK-17 · Sprečiti preklapanje rezervacija</text>
  <rect x="76" y="188" width="728" height="414" rx="14" fill="#fff" stroke="#dde2eb"/>
  <text x="104" y="228" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#667085">OPIS</text>
  <text x="104" y="257" font-family="Inter,Segoe UI,Arial" font-size="15" fill="#344054">Sistem mora da odbije novu rezervaciju ako postoji aktivna</text>
  <text x="104" y="280" font-family="Inter,Segoe UI,Arial" font-size="15" fill="#344054">rezervacija iste opreme koja se vremenski preklapa.</text>
  <text x="104" y="326" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#667085">KRITERIJUMI I KONTEKST</text>
  <rect x="104" y="343" width="668" height="74" rx="10" fill="#fafaff" stroke="#e5e7ef"/>
  <text x="124" y="369" font-family="Inter,Segoe UI,Arial" font-size="14" fill="#344054">• Slobodan termin → rezervacija se kreira.</text>
  <text x="124" y="393" font-family="Inter,Segoe UI,Arial" font-size="14" fill="#344054">• Preklapanje termina → eksplicitan poslovni neuspeh.</text>
  <text x="104" y="458" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#667085">KOMENTARI</text>
  <circle cx="118" cy="490" r="14" fill="#e7e8ff"/><text x="113" y="495" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700" fill="#4f46e5">A</text>
  <text x="143" y="487" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#344054">Asistent</text>
  <text x="143" y="508" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#667085">Dodati i granični slučaj kada prethodna rezervacija završava</text>
  <text x="143" y="528" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#667085">tačno u trenutku početka nove.</text>
