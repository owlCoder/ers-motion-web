    <text x="864" y="480" font-size="12" fill="#667085">Istorija</text><text x="864" y="505" font-size="13" fill="#344054">11:24 · status promenjen</text><text x="864" y="528" font-size="13" fill="#344054">10:56 · dodat komentar</text>
