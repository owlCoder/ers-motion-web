<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Slojevita organizacija AI konteksta</title>
  <desc id="desc">Pet slojeva: zadatak, relevantan kontekst, projektne instrukcije, skill i verifikacija.</desc>
  <rect width="1200" height="520" rx="24" fill="#fff"/>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#1F2937}
    .title{font-size:30px;font-weight:700;fill:#163A66}
    .label{font-size:18px;font-weight:700}
    .sub{font-size:13px;fill:#64748B}
  </style>
  <text x="60" y="60" class="title">Slojevita organizacija AI konteksta</text>

  <g>
    <rect x="210" y="96" width="780" height="66" rx="17" fill="#fff" stroke="#185ABD" stroke-width="2"/>
    <rect x="210" y="96" width="7" height="66" rx="4" fill="#185ABD"/>
    <text x="238" y="124" class="label">Zadatak</text>
    <text x="238" y="148" class="sub">konkretan problem koji se rešava u tekućem koraku</text>
  </g>

  <g>
    <rect x="245" y="176" width="710" height="66" rx="17" fill="#fff" stroke="#0E7490" stroke-width="2"/>
    <rect x="245" y="176" width="7" height="66" rx="4" fill="#0E7490"/>
    <text x="273" y="204" class="label">Relevantan kontekst</text>
    <text x="273" y="228" class="sub">issue · kod · testovi · dokumentacija · odluke projekta</text>
  </g>

  <g>
    <rect x="280" y="256" width="640" height="66" rx="17" fill="#fff" stroke="#6D28D9" stroke-width="2"/>
    <rect x="280" y="256" width="7" height="66" rx="4" fill="#6D28D9"/>
    <text x="308" y="284" class="label">Projektne instrukcije</text>
    <text x="308" y="308" class="sub">stabilna arhitektonska, bezbednosna i radna pravila</text>
  </g>

  <g>
    <rect x="315" y="336" width="570" height="66" rx="17" fill="#fff" stroke="#B45309" stroke-width="2"/>
    <rect x="315" y="336" width="7" height="66" rx="4" fill="#B45309"/>
    <text x="343" y="364" class="label">Skill</text>
    <text x="343" y="388" class="sub">ponovljiva procedura za jasno definisan tip zadatka</text>
  </g>

  <g>
    <rect x="350" y="416" width="500" height="66" rx="17" fill="#fff" stroke="#047857" stroke-width="2"/>
    <rect x="350" y="416" width="7" height="66" rx="4" fill="#047857"/>
    <text x="378" y="444" class="label">Verifikacija</text>
    <text x="378" y="468" class="sub">izgradnja projekta · testovi · diff · pregled rezultata</text>
  </g>
</svg>