  <text x="959" y="189" class="sub">alati · hooks · evaluacije</text>

  <rect x="55" y="305" width="1080" height="110" rx="18" fill="#F7FAFC" stroke="#D8E1EB"/>
  <text x="80" y="345" class="label">Projektni kontinuitet</text>
  <text x="80" y="376" class="sub">Od P1 svaki princip ostavlja proverljiv artefakt u istom projektnom repozitorijumu.</text>
