<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Tok praktikuma i projekta</title>
  <desc id="desc">Pregled grupa vežbi i kontinuiteta projektnih kontrolnih tačaka tokom semestra.</desc>
  <rect width="1200" height="500" rx="24" fill="#fff"/>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#1F2937}
    .title{font-size:30px;font-weight:700;fill:#163A66}
    .label{font-size:18px;font-weight:700}
    .sub{font-size:13px;fill:#64748B}
  </style>
  <text x="60" y="60" class="title">Tok praktikuma i projekta</text>

  <rect x="55" y="125" width="190" height="115" rx="18" fill="#fff" stroke="#185ABD" stroke-width="2"/>
  <rect x="55" y="125" width="7" height="115" rx="4" fill="#185ABD"/>
  <text x="79" y="162" class="label">1–2 · Obnova osnova</text>
  <text x="79" y="189" class="sub">OOP · Clean Code · Git</text>
  <path d="M245 183 H263" stroke="#94A3B8" stroke-width="3"/><path d="m261 176 14 7-14 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <rect x="275" y="125" width="190" height="115" rx="18" fill="#fff" stroke="#0E7490" stroke-width="2"/>
  <rect x="275" y="125" width="7" height="115" rx="4" fill="#0E7490"/>
  <text x="299" y="162" class="label">3 · Zahtevi i AI</text>
  <text x="299" y="189" class="sub">backlog · kriterijumi · kontekst</text>
  <path d="M465 183 H483" stroke="#94A3B8" stroke-width="3"/><path d="m481 176 14 7-14 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <rect x="495" y="125" width="190" height="115" rx="18" fill="#fff" stroke="#6D28D9" stroke-width="2"/>
  <rect x="495" y="125" width="7" height="115" rx="4" fill="#6D28D9"/>
  <text x="519" y="162" class="label">4–6 · Jezgro sistema</text>
  <text x="519" y="189" class="sub">SOLID · arhitektura · testovi</text>
  <path d="M685 183 H703" stroke="#94A3B8" stroke-width="3"/><path d="m701 176 14 7-14 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <rect x="715" y="125" width="190" height="115" rx="18" fill="#fff" stroke="#B45309" stroke-width="2"/>
  <rect x="715" y="125" width="7" height="115" rx="4" fill="#B45309"/>
  <text x="739" y="162" class="label">7–8 · Skills i agenti</text>
  <text x="739" y="189" class="sub">procedure · uloge · alati</text>
  <path d="M905 183 H923" stroke="#94A3B8" stroke-width="3"/><path d="m921 176 14 7-14 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <rect x="935" y="125" width="190" height="115" rx="18" fill="#fff" stroke="#047857" stroke-width="2"/>
