<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Od nejasnog zahteva do proverljivog ponašanja</title>
  <desc id="desc">Tok od poslovnog problema preko User Story-ja i kriterijuma prihvatanja do AI podrške, odluke tima i verifikacije.</desc>
  <rect width="1200" height="500" rx="24" fill="#fff"/>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#1F2937}
    .title{font-size:30px;font-weight:700;fill:#163A66}
    .label{font-size:17px;font-weight:700}
    .sub{font-size:13px;fill:#64748B}
  </style>
  <text x="60" y="60" class="title">Od nejasnog zahteva do proverljivog ponašanja</text>

  <g>
    <rect x="58" y="150" width="180" height="130" rx="18" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="58" y="150" width="7" height="130" rx="4" fill="#334155"/>
    <text x="82" y="187" class="label">Problem</text>
    <text x="82" y="215" class="sub">poslovna potreba</text>
  </g>
  <path d="M238 215 H278" stroke="#94A3B8" stroke-width="3"/><path d="m272 208 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <g>
    <rect x="285" y="150" width="180" height="130" rx="18" fill="#fff" stroke="#185ABD" stroke-width="2"/>
    <rect x="285" y="150" width="7" height="130" rx="4" fill="#185ABD"/>
    <text x="309" y="187" class="label">User Story</text>
    <text x="309" y="215" class="sub">uloga · cilj · vrednost</text>
  </g>
  <path d="M465 215 H505" stroke="#94A3B8" stroke-width="3"/><path d="m499 208 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <g>
    <rect x="512" y="150" width="200" height="130" rx="18" fill="#fff" stroke="#0E7490" stroke-width="2"/>
    <rect x="512" y="150" width="7" height="130" rx="4" fill="#0E7490"/>
    <text x="536" y="183" class="label">Kriterijumi</text>
    <text x="536" y="205" class="label">prihvatanja</text>
    <text x="536" y="236" class="sub">uspešni · negativni · granični</text>
  </g>
  <path d="M712 215 H752" stroke="#94A3B8" stroke-width="3"/><path d="m746 208 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <g>
    <rect x="759" y="150" width="190" height="130" rx="18" fill="#fff" stroke="#6D28D9" stroke-width="2"/>
    <rect x="759" y="150" width="7" height="130" rx="4" fill="#6D28D9"/>
    <text x="783" y="183" class="label">AI podrška</text>
    <text x="783" y="205" class="label">pri pregledu</text>
    <text x="783" y="236" class="sub">pitanja · rizici · propušteni slučajevi</text>
  </g>
  <path d="M949 215 H989" stroke="#94A3B8" stroke-width="3"/><path d="m983 208 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <g>
    <rect x="996" y="150" width="180" height="130" rx="18" fill="#fff" stroke="#047857" stroke-width="2"/>
    <rect x="996" y="150" width="7" height="130" rx="4" fill="#047857"/>
    <text x="1020" y="187" class="label">Odluka tima</text>
    <text x="1020" y="215" class="sub">prihvatiti · odbaciti</text>
    <text x="1020" y="237" class="sub">ili dodatno razjasniti</text>
  </g>

  <rect x="150" y="340" width="900" height="82" rx="16" fill="#F7FAFC" stroke="#D8E1EB"/>
  <text x="180" y="375" class="label">Verifikacija</text>
  <text x="180" y="402" class="sub">Kriterijum prihvatanja → testni scenario → kod ili diff → dokaz očekivanog ponašanja</text>
</svg>