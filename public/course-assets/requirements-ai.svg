<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Od nejasnog zahteva do proverljivog ponašanja</title>
  <desc id="desc">Tok od poslovnog problema preko User Story-ja i kriterijuma prihvatanja do AI podrške, odluke tima i verifikacije.</desc>
  <rect width="1200" height="520" rx="24" fill="#fff"/>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#1F2937}
    .title{font-size:30px;font-weight:700;fill:#163A66}
    .label{font-size:17px;font-weight:700}
    .sub{font-size:13px;fill:#64748B}
  </style>
  <text x="54" y="60" class="title">Od nejasnog zahteva do proverljivog ponašanja</text>

  <g>
    <rect x="50" y="142" width="188" height="150" rx="18" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="50" y="142" width="7" height="150" rx="4" fill="#334155"/>
    <text x="74" y="181" class="label">Problem</text>
    <text x="74" y="214" class="sub">poslovna potreba</text>
  </g>
  <path d="M238 217H270" stroke="#94A3B8" stroke-width="3"/><path d="m264 210 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <g>
    <rect x="278" y="142" width="188" height="150" rx="18" fill="#fff" stroke="#185ABD" stroke-width="2"/>
    <rect x="278" y="142" width="7" height="150" rx="4" fill="#185ABD"/>
    <text x="302" y="181" class="label">User Story</text>
    <text x="302" y="214" class="sub">uloga · cilj</text>
    <text x="302" y="235" class="sub">· vrednost</text>
  </g>
  <path d="M466 217H498" stroke="#94A3B8" stroke-width="3"/><path d="m492 210 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <g>
    <rect x="506" y="142" width="188" height="150" rx="18" fill="#fff" stroke="#0E7490" stroke-width="2"/>
    <rect x="506" y="142" width="7" height="150" rx="4" fill="#0E7490"/>
    <text x="530" y="177" class="label">Kriterijumi</text>
    <text x="530" y="200" class="label">prihvatanja</text>
    <text x="530" y="234" class="sub">uspešni · negativni</text>
    <text x="530" y="255" class="sub">· granični</text>
  </g>
  <path d="M694 217H726" stroke="#94A3B8" stroke-width="3"/><path d="m720 210 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <g>
    <rect x="734" y="142" width="188" height="150" rx="18" fill="#fff" stroke="#6D28D9" stroke-width="2"/>
    <rect x="734" y="142" width="7" height="150" rx="4" fill="#6D28D9"/>
    <text x="758" y="177" class="label">AI podrška</text>
    <text x="758" y="200" class="label">pri pregledu</text>
    <text x="758" y="234" class="sub">pitanja · rizici</text>
    <text x="758" y="255" class="sub">· propušteni slučajevi</text>
  </g>
  <path d="M922 217H954" stroke="#94A3B8" stroke-width="3"/><path d="m948 210 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>

  <g>
    <rect x="962" y="142" width="188" height="150" rx="18" fill="#fff" stroke="#047857" stroke-width="2"/>
    <rect x="962" y="142" width="7" height="150" rx="4" fill="#047857"/>
    <text x="986" y="181" class="label">Odluka tima</text>
    <text x="986" y="214" class="sub">prihvatiti · odbaciti</text>
    <text x="986" y="235" class="sub">ili dodatno razjasniti</text>
  </g>

  <rect x="130" y="354" width="940" height="108" rx="16" fill="#F7FAFC" stroke="#D8E1EB"/>
  <text x="160" y="391" class="label">Verifikacija</text>
  <text x="160" y="420" class="sub">Kriterijum prihvatanja → testni scenario → kod ili diff</text>
  <text x="160" y="442" class="sub">→ dokaz očekivanog ponašanja</text>
</svg>
