<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Testabilni dizajn i verifikacija</title>
  <desc id="desc">Veza između SOLID principa, dependency injection-a, unit testova, mock-ova i coverage-a.</desc>
  <rect width="1200" height="520" rx="24" fill="#fff"/>
  <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#1F2937}.title{font-size:30px;font-weight:700;fill:#163A66}.label{font-size:18px;font-weight:700}.sub{font-size:13px;fill:#64748B}</style>
  <text x="54" y="60" class="title">Testabilni dizajn i verifikacija</text>
  <g><rect x="50" y="142" width="240" height="138" rx="18" fill="#fff" stroke="#185ABD" stroke-width="2"/><rect x="50" y="142" width="7" height="138" rx="4" fill="#185ABD"/><text x="76" y="183" class="label">SOLID + DI</text><text x="76" y="216" class="sub">jasne granice</text><text x="76" y="237" class="sub">i zamenjive zavisnosti</text></g>
  <path d="M290 211H330" stroke="#94A3B8" stroke-width="3"/><path d="m324 204 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <g><rect x="338" y="142" width="240" height="138" rx="18" fill="#fff" stroke="#0E7490" stroke-width="2"/><rect x="338" y="142" width="7" height="138" rx="4" fill="#0E7490"/><text x="364" y="183" class="label">Unit tests</text><text x="364" y="216" class="sub">ponašanje jednog</text><text x="364" y="237" class="sub">use-case-a</text></g>
  <path d="M578 211H618" stroke="#94A3B8" stroke-width="3"/><path d="m612 204 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <g><rect x="626" y="142" width="240" height="138" rx="18" fill="#fff" stroke="#6D28D9" stroke-width="2"/><rect x="626" y="142" width="7" height="138" rx="4" fill="#6D28D9"/><text x="652" y="183" class="label">Moq</text><text x="652" y="216" class="sub">kontrolisane</text><text x="652" y="237" class="sub">spoljne granice</text></g>
  <path d="M866 211H906" stroke="#94A3B8" stroke-width="3"/><path d="m900 204 12 7-12 7" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <g><rect x="914" y="142" width="236" height="138" rx="18" fill="#fff" stroke="#B45309" stroke-width="2"/><rect x="914" y="142" width="7" height="138" rx="4" fill="#B45309"/><text x="940" y="183" class="label">Coverage</text><text x="940" y="216" class="sub">signal za grane</text><text x="940" y="237" class="sub">i propuštene scenarije</text></g>
  <rect x="110" y="342" width="980" height="112" rx="18" fill="#F7FAFC" stroke="#D8E1EB"/>
  <text x="142" y="380" class="label">Cilj nije procenat — cilj je regresiona zaštita</text>
  <text x="142" y="412" class="sub">Acceptance criteria i poslovna pravila određuju najvažnije test scenarije.</text>
  <text x="142" y="434" class="sub">Coverage pomaže da pronađemo šta smo propustili.</text>
</svg>
