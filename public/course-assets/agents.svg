<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="24" fill="#fff"/><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#1F2937}.title{font-size:30px;font-weight:700;fill:#163A66}.label{font-size:19px;font-weight:700}.sub{font-size:14px;fill:#64748B}.small{font-size:13px;fill:#64748B}</style><text x="60" y="60" class="title">Specijalizovani agenti i podela odgovornosti</text><rect x="450" y="100" width="300" height="90" rx="18" fill="#fff" stroke="#185ABD" stroke-width="2"/><rect x="450" y="100" width="7" height="90" rx="4" fill="#185ABD"/><text x="474" y="137" class="label">Orchestrator</text><text x="474" y="164" class="sub">bira sledeći korak i prosleđuje artefakte</text><rect x="80" y="285" width="230" height="100" rx="18" fill="#fff" stroke="#6D28D9" stroke-width="2"/><rect x="80" y="285" width="7" height="100" rx="4" fill="#6D28D9"/><text x="104" y="322" class="label">Architect</text><text x="104" y="349" class="sub">read-only plan + rizici</text><path d="M600 190 L195 285" stroke="#CBD5E1" stroke-width="3"/><rect x="340" y="285" width="230" height="100" rx="18" fill="#fff" stroke="#0E7490" stroke-width="2"/><rect x="340" y="285" width="7" height="100" rx="4" fill="#0E7490"/><text x="364" y="322" class="label">Developer</text><text x="364" y="349" class="sub">kontrolisan source diff</text><path d="M600 190 L455 285" stroke="#CBD5E1" stroke-width="3"/><rect x="600" y="285" width="230" height="100" rx="18" fill="#fff" stroke="#B45309" stroke-width="2"/><rect x="600" y="285" width="7" height="100" rx="4" fill="#B45309"/><text x="624" y="322" class="label">Tester</text><text x="624" y="349" class="sub">testovi + rezultat</text><path d="M600 190 L715 285" stroke="#CBD5E1" stroke-width="3"/><rect x="860" y="285" width="230" height="100" rx="18" fill="#fff" stroke="#047857" stroke-width="2"/><rect x="860" y="285" width="7" height="100" rx="4" fill="#047857"/><text x="884" y="322" class="la