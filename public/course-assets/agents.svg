<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Specijalizovane agentske uloge i podela odgovornosti</title>
  <desc id="desc">Koordinator usmerava specijalizovane agente za arhitekturu, implementaciju, testiranje i pregled.</desc>
  <rect width="1200" height="520" rx="24" fill="#fff"/>
  <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#1F2937}.title{font-size:30px;font-weight:700;fill:#163A66}.label{font-size:18px;font-weight:700}.sub{font-size:13px;fill:#64748B}</style>
  <text x="54" y="60" class="title">Specijalizovane agentske uloge i podela odgovornosti</text>
  <g><rect x="420" y="94" width="360" height="112" rx="18" fill="#fff" stroke="#185ABD" stroke-width="2"/><rect x="420" y="94" width="7" height="112" rx="4" fill="#185ABD"/><text x="448" y="134" class="label">Koordinator</text><text x="448" y="164" class="sub">bira sledeći korak i prosleđuje</text><text x="448" y="184" class="sub">samo potrebne artefakte</text></g>
  <path d="M600 206L175 294M600 206L455 294M600 206L745 294M600 206L1025 294" stroke="#CBD5E1" stroke-width="3" fill="none"/>
  <g><rect x="55" y="294" width="240" height="128" rx="18" fill="#fff" stroke="#6D28D9" stroke-width="2"/><rect x="55" y="294" width="7" height="128" rx="4" fill="#6D28D9"/><text x="79" y="333" class="label">Arhitekta</text><text x="79" y="363" class="sub">plan i rizici</text><text x="79" y="384" class="sub">bez izmene koda</text></g>
  <g><rect x="335" y="294" width="240" height="128" rx="18" fill="#fff" stroke="#0E7490" stroke-width="2"/><rect x="335" y="294" width="7" height="128" rx="4" fill="#0E7490"/><text x="359" y="333" class="label">Implementator</text><text x="359" y="363" class="sub">kontrolisana izmena</text><text x="359" y="384" class="sub">izvornog koda</text></g>
  <g><rect x="625" y="294" width="240" height="128" rx="18" fill="#fff" stroke="#B45309" stroke-width="2"/><rect x="625" y="294" width="7" height="128" rx="4" fill="#B45309"/><text x="649" y="333" class="label">Agent za testiranje</text><text x="649" y="363" class="sub">testovi i izlaz</text><text x="649" y="384" class="sub">analiza neuspeha</text></g>
  <g><rect x="905" y="294" width="240" height="128" rx="18" fill="#fff" stroke="#047857" stroke-width="2"/><rect x="905" y="294" width="7" height="128" rx="4" fill="#047857"/><text x="929" y="333" class="label">Agent za pregled</text><text x="929" y="363" class="sub">nalaz nad diff-om</text><text x="929" y="384" class="sub">bez izmene koda</text></g>
  <text x="142" y="476" class="sub">Granice imaju smisla kada uvode različit kontekst, dozvole ili odgovornost; veći broj agenata nije cilj sam po sebi.</text>
</svg>
