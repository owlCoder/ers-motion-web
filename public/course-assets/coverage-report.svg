<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" rx="26" fill="#f6f8fb"/>
  <rect x="34" y="30" width="1132" height="560" rx="18" fill="#fff" stroke="#d9e0e8" stroke-width="2"/>
  <rect x="34" y="30" width="1132" height="54" rx="18" fill="#f0f3f7"/>
  <rect x="34" y="66" width="1132" height="18" fill="#f0f3f7"/>
  <text x="62" y="64" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#1f2937">Code Coverage</text>
  <text x="930" y="63" font-family="Segoe UI, Arial" font-size="13" fill="#6b7280">ReservationService</text>
  <g font-family="Segoe UI, Arial">
    <rect x="62" y="112" width="250" height="112" rx="12" fill="#f4fbf7" stroke="#b8dfc9"/>
    <text x="84" y="145" font-size="13" fill="#4c6657">Line coverage</text>
    <text x="84" y="190" font-size="38" font-weight="700" fill="#137a4e">82%</text>
    <rect x="84" y="202" width="188" height="8" rx="4" fill="#dbe9e1"/><rect x="84" y="202" width="154" height="8" rx="4" fill="#1aa36f"/>
    <rect x="330" y="112" width="250" height="112" rx="12" fill="#fffaf0" stroke="#ead9aa"/>
    <text x="352" y="145" font-size="13" fill="#6a5b36">Branch coverage</text>
    <text x="352" y="190" font-size="38" font-weight="700" fill="#b7791f">67%</text>
    <rect x="352" y="202" width="188" height="8" rx="4" fill="#eee6d3"/><rect x="352" y="202" width="126" height="8" rx="4" fill="#d89b35"/>
    <rect x="598" y="112" width="250" height="112" rx="12" fill="#f6f8fb" stroke="#d8dee7"/>
    <text x="620" y="145" font-size="13" fill="#526174">Covered lines</text>
    <text x="620" y="190" font-size="38" font-weight="700" fill="#334155">41 / 50</text>
    <rect x="866" y="112" width="250" height="112" rx="12" fill="#fff7f7" stroke="#efc6c6"/>
    <text x="888" y="145" font-size="13" fill="#6b4141">Uncovered risk</text>
    <text x="888" y="190" font-size="28" font-weight="700" fill="#b4232b">2 branches</text>
  </g>
  <rect x="62" y="258" width="1054" height="214" rx="12" fill="#fbfcfe" stroke="#dfe5ec"/>
  <rect x="62" y="258" width="1054" height="38" rx="12" fill="#f2f5f8"/>
  <text x="82" y="283" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#405066">ReservationService.cs</text>
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="13">
    <text x="82" y="326" fill="#9aa5b4">31</text><rect x="120" y="306" width="5" height="26" rx="2" fill="#1aa36f"/><text x="142" y="326" fill="#334155">if (repository.HasOverlap(request.EquipmentId, request.From, request.To))</text>
    <text x="82" y="358" fill="#9aa5b4">32</text><rect x="120" y="338" width="5" height="26" rx="2" fill="#1aa36f"/><text x="142" y="358" fill="#334155">    return Result.Fail("OverlappingReservation");</text>
    <text x="82" y="390" fill="#9aa5b4">33</text><rect x="120" y="370" width="5" height="26" rx="2" fill="#d64545"/><text x="142" y="390" fill="#334155">if (!equipment.IsActive)</text>
    <text x="82" y="422" fill="#9aa5b4">34</text><rect x="120" y="402" width="5" height="26" rx="2" fill="#d64545"/><text x="142" y="422" fill="#334155">    return Result.Fail("EquipmentInactive");</text>
    <text x="82" y="454" fill="#9aa5b4">35</text><rect x="120" y="434" width="5" height="26" rx="2" fill="#1aa36f"/><text x="142" y="454" fill="#334155">return Result.Ok();</text>
  </g>
  <rect x="62" y="498" width="1054" height="62" rx="10" fill="#f7faff" stroke="#cadcf2"/>
  <text x="84" y="524" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#174a7c">Coverage se tumači zajedno sa rizikom</text>
  <text x="84" y="548" font-family="Segoe UI, Arial" font-size="12.5" fill="#4a596d">Nepokrivena grana za neaktivnu opremu je važnija od dodatnog testa trivijalnog getter-a, bez obzira na ukupan procenat.</text>
</svg>